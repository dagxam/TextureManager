name: Сборка Maven

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  сборка:
    name: Проверка и сборка плагина
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Проверка проекта Maven
        run: mvn -B -ntp clean verify

      - name: Загрузка готового JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TextureManager
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
