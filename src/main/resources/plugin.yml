name: TextureManager
version: 1.0.0-SNAPSHOT
main: me.dagxam.texturemanager.TextureManagerPlugin
api-version: '1.21'
author: dagxam
description: Автоматическая замена стандартных текстур Minecraft из папки плагина

commands:
  texture:
    description: Управление пользовательскими текстурами и автоматическим ресурс-паком
    usage: /texture <reload|send|status|list>
    aliases: [textures, tm]
    permission: texturemanager.admin

permissions:
  texturemanager.admin:
    description: Полный доступ к TextureManager
    default: op
  texturemanager.reload:
    description: Проверить PNG и пересобрать ресурс-пак
    default: op
  texturemanager.send:
    description: Отправить готовый ресурс-пак игрокам
    default: op
  texturemanager.status:
    description: Просмотреть состояние TextureManager
    default: op
  texturemanager.list:
    description: Просмотреть список загруженных текстур
    default: op
