# TextureManager — настройки плагина
# Все пояснения и технические сообщения сделаны на русском языке.

resource-pack:
  отправлять-при-входе: true
  обязательный: false
  сообщение: "Используется пользовательский ресурс-пак сервера."

  # Режим раздачи: built-in — встроенный HTTP-сервер, external — внешняя ссылка.
  режим: "built-in"

  встроенный-сервер:
    порт: 8080
    # Внешний адрес, который увидят игроки. Укажите публичный IP или домен.
    внешний-адрес: ""

  внешний-url: ""

горячая-перезагрузка:
  включена: true
  интервал-секунд: 3
  задержка-секунд: 2

резервные-копии:
  включены: true
  максимум-файлов: 10

проверка-текстур:
  проверять-png: true
  любое-разрешение: true
  предупреждать-о-большом-размере: true
  предупреждение-при-размере: 1024

ресурс-пак:
  имя-файла: "TextureManager.zip"
  описание: "Пользовательский ресурс-пак сервера"

папки:
  текстуры: "textures"
  ресурс-пак: "resourcepack"
  резервные-копии: "resourcepack/backup"

сообщения:
  префикс: "&8[&6TextureManager&8] &r"
  запуск: "&aПлагин запущен."
  остановка: "&eПлагин остановлен."
  доступ-запрещён: "&cУ вас нет прав для выполнения этой команды."
  только-игрок: "&cЭта команда доступна только игроку."
  неизвестная-команда: "&cНеизвестная подкоманда. Используйте &f/texture help&c."
