# ============================================================
# TextureManager — настройки плагина
# ============================================================
# Все пользовательские сообщения и пояснения находятся на русском языке.
# Названия команд и permission-узлы намеренно оставлены на английском.

# Основная настройка ресурс-пака.
resource-pack:
  # Отправлять ресурс-пак автоматически при входе игрока.
  отправлять-при-входе: true

  # Требовать обязательное принятие ресурс-пака.
  обязательный: false

  # Сообщение Minecraft при предложении скачать пакет.
  # Можно оставить пустым.
  сообщение: "Используется пользовательский ресурс-пак сервера."

# Автоматически отслеживать изменения в папке textures.
горячая-перезагрузка:
  включена: true

  # Интервал проверки файлов в секундах.
  интервал-секунд: 3

  # Задержка перед пересборкой после обнаружения изменения.
  задержка-секунд: 2

# Резервное копирование предыдущих сборок.
резервные-копии:
  включены: true

  # Максимальное количество резервных ZIP-файлов.
  максимум-файлов: 10

# Проверка изображений.
проверка-текстур:
  проверять-png: true

  # Не ограничивать разрешение текстуры жёстким списком.
  # Поддерживаются 16x16, 32x32, 64x64, 128x128, 256x256,
  # 512x512, 1024x1024 и другие корректные разрешения.
  любое-разрешение: true

  # Предупреждать в консоли о слишком больших текстурах.
  предупреждать-о-большом-размере: true

  # Размер стороны, начиная с которого выводится предупреждение.
  предупреждение-при-размере: 1024

# Система ресурс-пака.
ресурс-пак:
  # Имя готового ZIP-файла.
  имя-файла: "TextureManager.zip"

  # Описание, которое попадёт в pack.mcmeta.
  описание: "Пользовательский ресурс-пак сервера"

# Папки плагина.
папки:
  # Сюда администратор просто кладёт PNG-файлы.
  текстуры: "textures"

  # Здесь хранится готовый ресурс-пак.
  ресурс-пак: "resourcepack"

  # Здесь находятся резервные копии.
  резервные-копии: "resourcepack/backup"

# Сообщения выводятся на русском языке.
сообщения:
  префикс: "&8[&6TextureManager&8] &r"

  запуск: "&aПлагин запущен."
  остановка: "&eПлагин остановлен."

  папка-создана: "&7Создана папка текстур: &f%path%"
  изменений-нет: "&7Изменений в текстурах не обнаружено."

  сборка-начата: "&eНачинается сборка ресурс-пака..."
  сборка-завершена: "&aРесурс-пак успешно собран."
  сборка-ошибка: "&cНе удалось собрать ресурс-пак. Подробности смотрите в консоли."

  проверка-начата: "&eПроверка текстур..."
  проверка-завершена: "&aПроверка текстур завершена. Найдено: &f%count%&a."
  png-повреждён: "&cПовреждённый или некорректный PNG: &f%file%"
  файл-пропущен: "&eФайл пропущен: &f%file%"
  большой-размер: "&eБольшая текстура: &f%file% &7(%width%x%height%)"

  резервная-копия: "&7Создана резервная копия: &f%file%"
  резервная-копия-ошибка: "&cНе удалось создать резервную копию."

  sha1: "&7SHA-1 ресурс-пака: &f%sha1%"
  игроков-отправлено: "&aРесурс-пак отправлен игрокам."
  игрок-отправлен: "&aРесурс-пак отправлен игроку &f%player%&a."

  перезагрузка: "&eВыполняется горячая перезагрузка..."
  перезагрузка-завершена: "&aГорячая перезагрузка завершена."

  доступ-запрещён: "&cУ вас нет прав для выполнения этой команды."
  только-игрок: "&cЭта команда доступна только игроку."
  неизвестная-команда: "&cНеизвестная подкоманда. Используйте &f/texture help&c."

  состояние: "&7Состояние TextureManager:"
  состояние-версия: "&7Версия Minecraft: &f%version%"
  состояние-текстур: "&7Текстур: &f%count%"
  состояние-собрано: "&7Ресурс-пак собран: &f%built%"
  состояние-размер: "&7Размер пакета: &f%size%"
  состояние-sha1: "&7SHA-1: &f%sha1%"

  список-заголовок: "&6Установленные текстуры:"
  список-пуст: "&7Текстуры ещё не добавлены."
  список-строка: "&7- &f%path% &8(%width%x%height%)"
